<div class="player-stage" id="stage"></div>
<header class="hud-top">
  <div>
    <div class="hud-title" id="title"></div>
    <div class="hud-sub" id="subtitle"></div>
    <div class="hud-notice" id="notice" hidden></div>
  </div>
  <div class="hud-actions">
    <button class="btn btn-ghost" id="reset" hidden>Return to step</button>
    <button class="btn btn-secondary" id="notes-btn" hidden>Notes</button>
    <button class="btn btn-secondary" id="bare">Model only</button>
    <button class="btn btn-secondary" id="overview">Overview</button>
    <button class="btn btn-secondary btn-icon" id="fs" aria-label="Full screen" title="Full screen (F)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
</header>
<nav class="hud-bottom">
  <div class="hud-nav">
    <button class="btn btn-secondary btn-icon" id="prev" aria-label="Previous step"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
    <div class="hud-steps" id="steps"></div>
    <button class="btn btn-primary btn-icon blueprint" id="next" aria-label="Next step"><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
  </div>
  <div class="hud-hint">Drag to orbit · scroll to zoom · ← → step · M model only · O overview · F full screen</div>
</nav>
<aside class="notes-panel blueprint" id="notes" hidden><h6>Speaker notes</h6><div id="notes-text"></div></aside>
<div class="overlay" id="loading"><div class="overlay-label">Loading scene</div></div>
<div class="overlay" id="error" hidden>
  <div class="blueprint" style="padding:20px 24px;max-width:480px;pointer-events:auto;background:var(--color-bg)"><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
    <h4>Presentation failed to load</h4>
    <div id="error-msg" style="font-size:14px"></div>
  </div>
</div>
